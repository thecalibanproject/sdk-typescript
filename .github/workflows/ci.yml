name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json engines: node >= 20
        node: [20, 24]
    defaults:
      run:
        working-directory: sdk-typescript
    env:
      # test/generated.test.ts fails (instead of skipping) when ../core is missing.
      CALIBAN_REQUIRE_CORE: '1'
    steps:
      # Lay out the workspace so the drift check finds ../core/schemas/node.schema.json and
      # ../core/api/openapi.yaml, the contract src/generated/ is generated from.
      - uses: actions/checkout@v7
        with:
          path: sdk-typescript
      - uses: actions/checkout@v7
        with:
          repository: thecalibanproject/core
          path: core
          sparse-checkout: |
            schemas
            api
      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: sdk-typescript/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: sdk-typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Drift check: src/generated/ must be exactly what core's current schemas produce.
      - run: pnpm check:generated
      - run: pnpm test
      - run: pnpm build
